name: 🌤️ Hà Nội Weather Notification

on:
  # 6:00 AM GMT+7  = 23:00 UTC (ngày hôm trước)
  # 12:00 PM GMT+7  = 05:00 UTC
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 5 * * *"

  # Cho phép chạy thủ công từ GitHub để test
  workflow_dispatch:

jobs:
  send-weather:
    name: Gửi thông báo thời tiết
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Cài đặt thư viện
        run: pip install -r weather_bot/requirements.txt

      - name: 🌤️ Chạy Weather Bot
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python weather_bot/weather_bot.py
